<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Slope Slider — Level Editor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #1a1f2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #E8F0FC;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #2a3142;
    border-bottom: 1px solid #1a0d05;
    flex-shrink: 0;
  }
  .topbar input[type=text] {
    flex: 1;
    background: #1a1f2e;
    border: 1px solid #455168;
    color: #E8F0FC;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  .topbar button, .palette button, .actions button {
    background: #455168;
    border: 1px solid #1a0d05;
    color: #E8F0FC;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    min-height: 36px;
    -webkit-tap-highlight-color: transparent;
  }
  .topbar button:active, .palette button:active, .actions button:active {
    background: #5b6783;
  }
  .topbar button.primary { background: #2e7d4f; }
  .topbar button.danger { background: #7d2e2e; }

  .canvas-wrap {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #f5f9fc;
  }
  canvas#editor {
    display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .scroll-indicator {
    position: absolute;
    right: 6px;
    top: 6px;
    bottom: 6px;
    width: 4px;
    background: rgba(0,0,0,0.1);
    border-radius: 2px;
    pointer-events: none;
  }
  .scroll-indicator-thumb {
    position: absolute;
    right: 0;
    width: 4px;
    background: #2a3142;
    border-radius: 2px;
  }
  .hud-overlay {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(42, 49, 66, 0.85);
    color: #E8F0FC;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    pointer-events: none;
    line-height: 1.4;
  }

  .palette {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 8px;
    background: #2a3142;
    border-top: 1px solid #1a0d05;
    flex-shrink: 0;
  }
  .palette button {
    padding: 8px 4px;
    font-size: 11px;
    background: #455168;
    flex-direction: column;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 56px;
  }
  .palette button.active {
    background: #2e7d4f;
    box-shadow: 0 0 0 2px #5fc587;
  }
  .palette button.delete-mode.active {
    background: #7d2e2e;
    box-shadow: 0 0 0 2px #d65555;
  }
  .palette .icon { font-size: 18px; line-height: 1; }
  .palette .label { font-size: 10px; opacity: 0.9; }

  /* Variant strip — appears under the palette when a kind with variants is
     selected (tree, snowman, ice). Hidden when there are no variants. */
  .variant-strip {
    display: none;
    flex-direction: row;
    gap: 6px;
    padding: 6px 8px;
    background: #1f2533;
    border-top: 1px solid #1a0d05;
    overflow-x: auto;
    flex-shrink: 0;
  }
  .variant-strip.show { display: flex; }
  .variant-strip .variant-chip {
    background: #455168;
    border: 1px solid #1a0d05;
    border-radius: 6px;
    padding: 4px;
    min-width: 56px;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .variant-chip canvas { display: block; image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }
  .variant-chip.active {
    background: #2e7d4f;
    box-shadow: 0 0 0 2px #5fc587;
  }

  .actions {
    display: flex;
    gap: 6px;
    padding: 8px;
    background: #2a3142;
    border-top: 1px solid #1a0d05;
    flex-shrink: 0;
  }
  .actions button { flex: 1; }
  .actions button.active {
    background: #2e7d4f;
    box-shadow: 0 0 0 2px #5fc587;
  }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal {
    background: #2a3142;
    border: 1px solid #1a0d05;
    border-radius: 10px;
    padding: 16px;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal h2 { margin: 0 0 4px; font-size: 16px; }
  .modal label { font-size: 12px; opacity: 0.8; display: block; margin-bottom: 4px; }
  .modal input, .modal textarea {
    width: 100%;
    background: #1a1f2e;
    border: 1px solid #455168;
    color: #E8F0FC;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    font-family: monospace;
  }
  .modal textarea {
    min-height: 140px;
    resize: vertical;
  }
  .modal .row {
    display: flex; gap: 8px;
  }
  .modal .row button { flex: 1; }
  .modal-list {
    max-height: 200px;
    overflow-y: auto;
    background: #1a1f2e;
    border: 1px solid #455168;
    border-radius: 6px;
  }
  .modal-list-item {
    padding: 10px 12px;
    border-bottom: 1px solid #2a3142;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .modal-list-item:last-child { border-bottom: none; }
  .modal-list-item .name { flex: 1; font-size: 13px; }
  .modal-list-item .meta { font-size: 11px; opacity: 0.6; }
  .modal-list-item button {
    padding: 4px 8px;
    font-size: 11px;
    min-height: 0;
    background: #455168;
    border: 1px solid #1a0d05;
    color: #E8F0FC;
    border-radius: 4px;
  }
  .modal-list-item button.delete { background: #7d2e2e; }
</style>
</head>
<body>
  <div class="topbar">
    <input type="text" id="levelName" placeholder="Level name" value="My Level">
    <button id="btnSave">Save</button>
    <button id="btnExport" class="primary">Export</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="editor"></canvas>
    <div class="scroll-indicator"><div class="scroll-indicator-thumb" id="scrollThumb"></div></div>
    <div class="hud-overlay" id="hudInfo">y: 0 / 4000</div>
  </div>

  <div class="palette" id="palette">
    <button data-kind="tree"><span class="icon">🌲</span><span class="label">Tree</span></button>
    <button data-kind="log"><span class="icon">🪵</span><span class="label">Log</span></button>
    <button data-kind="ice"><span class="icon">🧊</span><span class="label">Ice</span></button>
    <button data-kind="snowman"><span class="icon">☃️</span><span class="label">Snowman</span></button>
    <button data-kind="jump"><span class="icon">↗️</span><span class="label">Ramp</span></button>
    <button data-kind="cliff"><span class="icon">⬇️</span><span class="label">Cliff</span></button>
    <button data-kind="powder"><span class="icon">❄️</span><span class="label">Powder</span></button>
    <button data-kind="avalanche_trigger"><span class="icon">⚠️</span><span class="label">Avalanche</span></button>
    <button data-kind="animal"><span class="icon">🦌</span><span class="label">Animal</span></button>
    <button data-kind="rock"><span class="icon">🪨</span><span class="label">Rock</span></button>
  </div>

  <div class="variant-strip" id="variantStrip">
    <!-- Filled in by JS when a kind with variants is selected -->
  </div>

  <div class="actions">
    <button id="btnAutoTrees">🌲 Auto-trees</button>
    <button id="btnBoulderField">🪨 Boulder field</button>
    <button id="btnEnableBirds">🐦 Enable birds</button>
    <button id="btnOverview">🔭 Overview</button>
    <button id="btnDelete" class="delete-mode">Delete mode</button>
    <button id="btnLength">Length</button>
    <button id="btnLoad">Load</button>
    <button id="btnNew" class="danger">New</button>
  </div>

    };
    const assets = {};
    for(const k in ASSETS_SRC){
      const img = new Image();
      img.src = ASSETS_SRC[k];
      assets[k] = img;
    }
    // Tree variants used by the game
    const TREES = ['tree0','tree1','tree2','tree3'];
    const SNOWMEN = ['snowman0','snowman1','snowman2','snowman3','snowman4','snowman5'];
    const ICES = ['ice_a','ice_b','ice_c'];
    const ROCKS = ['rock_s1','rock_s2','rock_s3','rock_m1','rock_m2','rock_m3','rock_l1','rock_l2','rock_l3'];
    // Per-variant w/h for rocks — mirrors ROCK_SPECS in the game so what
    // you place in the editor matches what gets rendered in-game.
    const ROCK_SPECS = {
      rock_s1: { w: 48, h: 44 },
      rock_s2: { w: 48, h: 52 },
      rock_s3: { w: 64, h: 44 },
      rock_m1: { w: 80, h: 78 },
      rock_m2: { w: 72, h: 68 },
      rock_m3: { w: 96, h: 88 },
      rock_l1: { w: 144, h: 116 },
      rock_l2: { w: 112, h: 108 },
      rock_l3: { w: 96, h: 120 },
    };

    // Game canvas dimensions — match the live game so x positions translate
    const GAME_W = 360;
    const GAME_H = 640;

    // ============ STATE ============
    let level = {
      name: 'My Level',
      length: 4000,
      obstacles: [], // each: { kind, y, xFrac } — xFrac is 0..1 (fraction of GAME_W)
    };
    let scrollY = 0;          // current top of view in world coordinates
    let selectedKind = 'tree';
    let deleteMode = false;
    let pinchActive = false;

    // ============ CANVAS SIZING ============
    const canvas = document.getElementById('editor');
    const ctx = canvas.getContext('2d');
    let canvasW = 0, canvasH = 0, viewScale = 1;
    // viewportX is the left edge of the GAME_W-wide playable area within the
    // canvas. On wide screens the canvas extends well beyond the playable
    // area, so we render the forest in those margins for visual context.
    let viewportX = 0;

    // Overview mode: when on, zoom out so the entire level fits vertically
    // in the canvas. Useful for getting a bird's-eye sense of pacing,
    // obstacle distribution, etc. Off by default. Toggled via the toolbar
    // "Overview" button.
    let overviewMode = false;

    function resizeCanvas(){
      const wrap = canvas.parentElement;
      const dpr = window.devicePixelRatio || 1;
      const cssW = wrap.clientWidth;
      const cssH = wrap.clientHeight;
      canvas.width = cssW * dpr;
      canvas.height = cssH * dpr;
      canvas.style.width = cssW + 'px';
      canvas.style.height = cssH + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      canvasW = cssW;
      canvasH = cssH;
      if(overviewMode){
        // Fit the entire level vertically. Pick the smaller of the
        // height-fit scale and the width-fit scale (the level shouldn't
        // be wider than the canvas either).
        const heightFit = canvasH / Math.max(1, level.length);
        const widthFit = canvasW / GAME_W;
        viewScale = Math.min(heightFit, widthFit);
        scrollY = 0;
      } else {
        // Normal: cap so wide desktop screens don't blow obstacles up huge.
        // On a phone-width canvas (~360-400px) this is ~1x. On a wider
        // canvas we render the GAME_W column centered with forest in the
        // margins.
        const MAX_SCALE = 1.4;
        viewScale = Math.min(canvasW / GAME_W, MAX_SCALE);
      }
      viewportX = (canvasW - GAME_W * viewScale) / 2;
      draw();
    }
    window.addEventListener('resize', resizeCanvas);

    // Lazily-created offscreen canvas used by the ice-cluster union render
    // pass. Sized to match the main canvas's device-pixel buffer; reused
    // across frames so we don't allocate every render.
    let _iceOffscreen = null;
    function ensureIceOffscreen(){
      if(!_iceOffscreen
         || _iceOffscreen.canvas.width !== canvas.width
         || _iceOffscreen.canvas.height !== canvas.height){
        const c = document.createElement('canvas');
        c.width = canvas.width;
        c.height = canvas.height;
        _iceOffscreen = { canvas: c, ctx: c.getContext('2d') };
      }
      return _iceOffscreen;
    }

    // ============ COORDINATE HELPERS ============
    // Screen y ↔ world y (vertical scrolling)
    function screenToWorldY(sy){ return scrollY + sy / viewScale; }
    function worldToScreenY(wy){ return (wy - scrollY) * viewScale; }
    // Screen x ↔ world x — accounts for the centered viewport on wide canvases
    function screenToWorldX(sx){ return (sx - viewportX) / viewScale; }
    function worldToScreenX(wx){ return wx * viewScale + viewportX; }

    // ============ DRAW ============
    function draw(){
      // Full canvas background — slightly darker so the playable viewport stands out
      ctx.fillStyle = '#e5edf5';
      ctx.fillRect(0, 0, canvasW, canvasH);

      // Playable viewport background (lighter snow)
      ctx.fillStyle = '#f5f9fc';
      ctx.fillRect(viewportX, 0, GAME_W * viewScale, canvasH);

      // Procedurally-placed forest edges — visual reference only, not editable.
      // Same algorithm as the game so the path frames the way it will in-game.
      drawForestEdges();

      // Path centerline — middle of the playable viewport
      ctx.strokeStyle = 'rgba(38, 33, 92, 0.10)';
      ctx.lineWidth = 1;
      const centerX = viewportX + (GAME_W * viewScale) / 2;
      ctx.beginPath();
      ctx.moveTo(centerX, 0);
      ctx.lineTo(centerX, canvasH);
      ctx.stroke();

      // Distance markers every 500 world units — only across the playable viewport
      ctx.fillStyle = 'rgba(38, 33, 92, 0.35)';
      ctx.font = '500 11px -apple-system, sans-serif';
      ctx.textAlign = 'left';
      for(let y = 0; y <= level.length; y += 500){
        const sy = worldToScreenY(y);
        if(sy < -20 || sy > canvasH + 20) continue;
        ctx.strokeStyle = 'rgba(38, 33, 92, 0.10)';
        ctx.beginPath();
        ctx.moveTo(viewportX, sy);
        ctx.lineTo(viewportX + GAME_W * viewScale, sy);
        ctx.stroke();
        ctx.fillText(y + 'm', viewportX + 6, sy - 4);
      }

      // Start and finish lines (visual landmarks across playable area only)
      const startY = worldToScreenY(0);
      if(startY > -10 && startY < canvasH + 10){
        ctx.fillStyle = '#2e7d4f';
        ctx.fillRect(viewportX, startY - 2, GAME_W * viewScale, 4);
        ctx.fillStyle = '#fff';
        ctx.font = '700 12px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('START', centerX, startY - 6);
      }
      const finishY = worldToScreenY(level.length - 200);
      if(finishY > -10 && finishY < canvasH + 10){
        const stripeW = 10;
        for(let x = 0; x < GAME_W * viewScale; x += stripeW){
          ctx.fillStyle = (Math.floor(x/stripeW) % 2 === 0) ? '#E24B4A' : '#FFFFFF';
          ctx.fillRect(viewportX + x, finishY - 3, stripeW, 6);
        }
        ctx.fillStyle = '#E24B4A';
        ctx.font = '700 12px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('FINISH', centerX, finishY - 8);
      }

      // Render placed obstacles, sorted by visual bottom of each sprite so
      // tall sprites (cliffs especially) layer correctly.
      const sortKey = (o) => {
        if(o.kind === 'tree' || o.kind === 'snowman' || o.kind === 'log') return o.y;
        if(o.kind === 'cliff') return o.y; // sort by lip
        if(o.kind === 'avalanche_trigger') return o.y;
        if(o.kind === 'powder') return o.y - (o.h || 32*3) / 2 - 1; // flat ground, draws early
        return o.y + 16;
      };
      const sorted = level.obstacles.slice().sort((a, b) => sortKey(a) - sortKey(b));
      for(const o of sorted){
        // Ice is handled by the union-render pass below — skip per-sprite
        // draw so we don't double-render with borders poking through.
        if(o.kind === 'ice') continue;
        drawObstacle(o);
      }

      // Ice union-render pass: group touching ice patches into clusters
      // and render each as a single unified shape (one continuous interior
      // + one outer perimeter). Eliminates seam cusps where multiple
      // patches contact. Matches the in-game render.
      const visibleIce = [];
      for(const o of level.obstacles){
        if(o.kind !== 'ice') continue;
        const sx = worldToScreenX(o.xFrac * GAME_W);
        const sy = worldToScreenY(o.y);
        if(sx < -100 || sx > canvasW + 100 || sy < -100 || sy > canvasH + 100) continue;
        const variant = o.variant || ICES[Math.abs(Math.floor(o.y * 0.7)) % 3];
        visibleIce.push({ sx, sy, variant });
      }
      if(visibleIce.length >= 1){
        const TOUCH_DIST = 80 * viewScale;
        const BLOB_R = 38 * viewScale;
        const INNER_R = 32 * viewScale;
        const w = 32 * 3 * viewScale;
        const h = 32 * 3 * viewScale;

        // Connected components via union-find
        const n = visibleIce.length;
        const parent = new Array(n);
        for(let i = 0; i < n; i++) parent[i] = i;
        function find(x){ while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
        function union(x, y){ const a = find(x), b = find(y); if(a !== b) parent[a] = b; }
        for(let i = 0; i < n; i++){
          for(let j = i + 1; j < n; j++){
            const dx = visibleIce[j].sx - visibleIce[i].sx;
            const dy = visibleIce[j].sy - visibleIce[i].sy;
            if(dx*dx + dy*dy < TOUCH_DIST * TOUCH_DIST) union(i, j);
          }
        }
        const clusters = new Map();
        for(let i = 0; i < n; i++){
          const r = find(i);
          if(!clusters.has(r)) clusters.set(r, []);
          clusters.get(r).push(i);
        }
        for(const indices of clusters.values()){
          if(indices.length === 1){
            // Lone patch — normal sprite render
            const m = visibleIce[indices[0]];
            const imgA = assets[m.variant];
            if(!imgA || !imgA.complete) continue;
            ctx.drawImage(imgA, Math.round(m.sx - w/2), Math.round(m.sy - h/2), w, h);
            continue;
          }
          // Cluster — use borderless-sprite + offscreen-erase approach to
          // match the in-game render exactly:
          //   1) Stamp every member's BORDERLESS sprite — interior texture
          //      tiles cleanly with no internal seam lines.
          //   2) For each member, stamp the BORDERED sprite into an
          //      offscreen, then erase pixels covered by any neighbor's
          //      borderless silhouette. The leftover border pixels form
          //      the outer perimeter only.
          const members = indices.map(i => visibleIce[i]);

          // 1) Borderless interiors.
          for(const m of members){
            const img = assets[m.variant + '_nb'] || assets[m.variant];
            if(!img || !img.complete) continue;
            ctx.drawImage(img, Math.round(m.sx - w/2), Math.round(m.sy - h/2), w, h);
          }

          // 2) Outer outline via offscreen canvas.
          const off = ensureIceOffscreen();
          const ox = off.ctx;
          const dpr = window.devicePixelRatio || 1;
          for(const m of members){
            const borderedImg = assets[m.variant];
            if(!borderedImg || !borderedImg.complete) continue;
            ox.clearRect(0, 0, off.canvas.width, off.canvas.height);
            // Editor's main ctx has a DPR transform applied; mirror it on
            // the offscreen so we can use the same CSS-pixel coordinates.
            ox.save();
            ox.setTransform(dpr, 0, 0, dpr, 0, 0);
            ox.globalCompositeOperation = 'source-over';
            ox.drawImage(borderedImg,
              Math.round(m.sx - w/2), Math.round(m.sy - h/2),
              w, h);
            ox.globalCompositeOperation = 'destination-out';
            for(const other of members){
              if(other === m) continue;
              const otherImg = assets[other.variant + '_nb'] || assets[other.variant];
              if(!otherImg || !otherImg.complete) continue;
              ox.drawImage(otherImg,
                Math.round(other.sx - w/2), Math.round(other.sy - h/2),
                w, h);
            }
            ox.restore();
            // Blit offscreen back as a 1:1 pixel copy (bypass main ctx
            // transform so the offscreen pixels land where they were
            // drawn).
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.drawImage(off.canvas, 0, 0);
            ctx.restore();
          }
        }
      }

      // Scroll thumb
      const thumb = document.getElementById('scrollThumb');
      const totalScroll = level.length + canvasH / viewScale;
      const visible = canvasH / viewScale;
      const thumbH = Math.max(20, (visible / totalScroll) * canvas.parentElement.clientHeight);
      const thumbY = (scrollY / totalScroll) * canvas.parentElement.clientHeight;
      thumb.style.height = thumbH + 'px';
      thumb.style.top = thumbY + 'px';

      // HUD info
      document.getElementById('hudInfo').textContent =
        `y: ${Math.round(scrollY)} – ${Math.round(scrollY + canvasH/viewScale)} / ${level.length}\nobstacles: ${level.obstacles.length}`;
    }

    // Forest edges: matches the game's generation, drawn as static decoration.
    // The trees frame the playable area on both sides, giving you visual
    // context for where the trail is and where obstacles will sit relative
    // to the boundary.
    function drawForestEdges(){
      const EDGE_OFFSET = GAME_W/2 + 70;
      const LAYER_STEP = 85;
      const NUM_LAYERS = 2;
      const centerWorldX = GAME_W / 2;
      const treesToRender = [];

      // LEFT side
      for(let layer = 0; layer < NUM_LAYERS; layer++){
        const layerOffset = EDGE_OFFSET + layer * LAYER_STEP;
        const baseSpacing = 140 + layer * 10;
        const layerSeed = (layer + 1) * 9277;
        let y = 200 + layer * 70;
        while(y < level.length){
          const skip = ((y * 31 + layerSeed) % 6 === 0);
          if(!skip){
            const jitter = ((y * 12345 + layerSeed) % 50);
            const x = centerWorldX - layerOffset + jitter;
            treesToRender.push({ x, y, seed: y + layerSeed });
          }
          y += baseSpacing + ((y * 7919) % 60);
        }
      }
      // RIGHT side
      for(let layer = 0; layer < NUM_LAYERS; layer++){
        const layerOffset = EDGE_OFFSET + layer * LAYER_STEP;
        const baseSpacing = 140 + layer * 10;
        const layerSeed = (layer + 1) * 4567;
        let y = 280 + layer * 70;
        while(y < level.length){
          const skip = ((y * 31 + layerSeed) % 6 === 0);
          if(!skip){
            const jitter = ((y * 12345 + layerSeed) % 50);
            const x = centerWorldX + layerOffset - jitter;
            treesToRender.push({ x, y, seed: y + layerSeed + 100000 });
          }
          y += baseSpacing + ((y * 7919) % 60);
        }
      }

      // Depth sort with placed obstacles by Y
      treesToRender.sort((a, b) => a.y - b.y);
      for(const t of treesToRender){
        const variant = TREES[Math.abs(Math.floor(t.seed * 1.7)) % 4];
        const img = assets[variant];
        if(!img || !img.complete) continue;
        const sx = worldToScreenX(t.x);
        const sy = worldToScreenY(t.y);
        if(sy < -250 || sy > canvasH + 50) continue;
        const w = 33 * 4 * viewScale;
        const h = 57 * 4 * viewScale;
        ctx.drawImage(img, sx - w/2, sy - h, w, h);
      }
    }

    function drawObstacle(o){
      const sx = worldToScreenX(o.xFrac * GAME_W);
      const sy = worldToScreenY(o.y);
      if(sy < -200 || sy > canvasH + 200) return;

      const SCALE = viewScale; // match in-game render scale

      if(o.kind === 'tree'){
        // Use explicit variant if specified, else deterministic hash
        const variant = o.variant || TREES[Math.abs((o.y * 73856) ^ Math.floor(o.xFrac * 1000)) % 4];
        const img = assets[variant];
        const w = 33 * 4 * SCALE;
        const h = 57 * 4 * SCALE;
        if(img.complete) ctx.drawImage(img, sx - w/2, sy - h, w, h);
      } else if(o.kind === 'log'){
        const img = assets.log;
        const w = 32 * 2 * SCALE;
        const h = 32 * 2 * SCALE;
        if(img.complete) ctx.drawImage(img, sx - w/2, sy - h, w, h);
      } else if(o.kind === 'rock'){
        // Rocks: use the variant's per-rock width/height. Anchor at base
        // (sy is the rock's bottom edge in world coords), same as trees.
        const variant = o.variant || ROCKS[Math.abs((o.y * 73856) ^ Math.floor(o.xFrac * 1000)) % ROCKS.length];
        const spec = ROCK_SPECS[variant] || ROCK_SPECS['rock_m1'];
        const img = assets[variant];
        const w = spec.w * SCALE;
        const h = spec.h * SCALE;
        if(img && img.complete) ctx.drawImage(img, sx - w/2, sy - h + 4 * SCALE, w, h);
      } else if(o.kind === 'snowman'){
        const variant = o.variant || SNOWMEN[Math.abs(Math.floor(o.y * 1.3)) % 6];
        const img = assets[variant];
        const w = 32 * 2 * SCALE;
        const h = 64 * 2 * SCALE;
        if(img.complete) ctx.drawImage(img, sx - w/2, sy - h, w, h);
      } else if(o.kind === 'ice'){
        const variant = o.variant || ICES[Math.abs(Math.floor(o.y * 0.7)) % 3];
        const img = assets[variant];
        const w = 32 * 3 * SCALE;
        const h = 32 * 3 * SCALE;
        if(img.complete) ctx.drawImage(img, sx - w/2, sy - h/2, w, h);
      } else if(o.kind === 'jump'){
        const img = assets.ramp;
        const w = 32 * 3 * SCALE;
        const h = 32 * 3 * SCALE;
        if(img.complete) ctx.drawImage(img, sx - w/2, sy - h/2, w, h);
      } else if(o.kind === 'cliff'){
        // Cliff spans the playable viewport width. y is the TOP edge (the
        // snow lip), with a thick snow cap above and the cliff face below.
        // Matches the in-game render so what you place is what you play.
        const img = assets.cliff;
        const h = 96 * 4 * SCALE; // 4x as tall — matches game
        const tileW = (32 * h) / 96;
        const totalW = GAME_W * viewScale;
        const tilesNeeded = Math.ceil(totalW / tileW);
        const faceTop = sy;

        // Snow cap above
        const capH = 36 * SCALE;
        const capGrad = ctx.createLinearGradient(0, faceTop - capH, 0, faceTop);
        capGrad.addColorStop(0, 'rgba(245, 250, 255, 0)');
        capGrad.addColorStop(0.55, 'rgba(232, 240, 252, 0.65)');
        capGrad.addColorStop(1, 'rgba(220, 230, 245, 1.0)');
        ctx.fillStyle = capGrad;
        ctx.fillRect(viewportX, faceTop - capH, totalW, capH);
        ctx.fillStyle = 'rgba(150, 165, 195, 0.35)';
        ctx.fillRect(viewportX, faceTop - 2, totalW, 2);

        // Cliff face
        if(img.complete){
          for(let i = 0; i < tilesNeeded; i++){
            ctx.drawImage(img, viewportX + i * tileW, faceTop, tileW, h);
          }
        }

        // Haze below
        const baseY = faceTop + h;
        const hazeH = 60 * SCALE;
        const hazeGrad = ctx.createLinearGradient(0, baseY - 20, 0, baseY + hazeH);
        hazeGrad.addColorStop(0, 'rgba(245, 250, 255, 0)');
        hazeGrad.addColorStop(1, 'rgba(245, 250, 255, 0.85)');
        ctx.fillStyle = hazeGrad;
        ctx.fillRect(viewportX, baseY - 20, totalW, hazeH + 20);
      } else if(o.kind === 'powder'){
        // Powder snow patch — rendered as a single canvas pattern fill for
        // seamless tiling. Matches the in-game render exactly.
        const img = assets.powder;
        const w = (o.w || 32*4) * SCALE;
        const h = (o.h || 32*3) * SCALE;
        if(img.complete){
          const dx = sx - w / 2;
          const dy = sy - h / 2;
          // Cache pattern on the obstacle so it's not recreated each frame
          if(!o._editorPattern){
            try { o._editorPattern = ctx.createPattern(img, 'repeat'); } catch(e){}
          }
          if(o._editorPattern){
            ctx.save();
            ctx.translate(dx, dy);
            // Apply SCALE so the tile appears at the same scale as other obstacles
            ctx.scale(SCALE, SCALE);
            ctx.fillStyle = o._editorPattern;
            ctx.fillRect(0, 0, w / SCALE, h / SCALE);
            ctx.restore();
          }
        }
      } else if(o.kind === 'avalanche_trigger'){
        // Editor-only visualization for the invisible avalanche trigger.
        // A bold yellow warning band stretches across the playable area at
        // the trigger's y — clearly marks the line that fires the event.
        const bandY = sy;
        const totalW = GAME_W * viewScale;
        // Striped warning band
        const stripeW = 16;
        for(let x = 0; x < totalW; x += stripeW){
          ctx.fillStyle = (Math.floor(x/stripeW) % 2 === 0) ? 'rgba(255, 200, 60, 0.85)' : 'rgba(40, 30, 0, 0.85)';
          ctx.fillRect(viewportX + x, bandY - 6, stripeW, 12);
        }
        // Centered label
        ctx.fillStyle = '#1a0d05';
        ctx.font = '700 12px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚠ AVALANCHE TRIGGER', viewportX + totalW/2, bandY + 1);
        ctx.textBaseline = 'alphabetic';
      } else if(o.kind === 'animal'){
        // Animal preview: draw the first idle frame from the species' idle
        // strip, flipped if direction='left'. Also draw a thin dashed arrow
        // indicating which way it will dart when triggered. Bears use a
        // different indicator (a down-arrow showing they charge straight
        // down the slope when the player passes).
        const species = o.species || o.variant || 'deer_buck';
        const direction = o.direction || 'right';
        const isBear = species === 'bear';
        const isDeer = species.startsWith('deer');
        const stripKey = species + '_idle';
        const img = assets[stripKey];
        const visW = isBear ? 96 : (isDeer ? 80 : 56);
        const visH = isBear ? 96 : (isDeer ? 80 : 56);
        const w = visW * SCALE;
        const h = visH * SCALE;
        const FRAME_SRC = 32;
        const dx = sx - w/2;
        const dy = sy - h/2;
        if(img && img.complete){
          // Bears are front-facing; don't flip them.
          const flip = !isBear && direction === 'left';
          if(flip){
            ctx.save();
            ctx.translate(dx + w, dy);
            ctx.scale(-1, 1);
            ctx.drawImage(img, 0, 0, FRAME_SRC, FRAME_SRC, 0, 0, w, h);
            ctx.restore();
          } else {
            ctx.drawImage(img, 0, 0, FRAME_SRC, FRAME_SRC, dx, dy, w, h);
          }
        }
        // Direction indicator
        ctx.save();
        if(isBear){
          // Bear: draw a downward dashed arrow indicating it charges down
          // the slope when the player passes its y.
          ctx.strokeStyle = '#e25f5f';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 3]);
          const lineX = sx + w/2 + 6;
          const lineLen = 32 * SCALE;
          ctx.beginPath();
          ctx.moveTo(lineX, sy);
          ctx.lineTo(lineX, sy + lineLen);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(lineX, sy + lineLen);
          ctx.lineTo(lineX - 4, sy + lineLen - 6);
          ctx.lineTo(lineX + 4, sy + lineLen - 6);
          ctx.closePath();
          ctx.fillStyle = '#e25f5f';
          ctx.fill();
        } else {
          // Deer/rabbit: side-darting arrow
          ctx.strokeStyle = direction === 'right' ? '#5fc587' : '#e2b15f';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 3]);
          const lineY = sy + h/2 + 4;
          const lineLen = 36 * SCALE;
          const dir = direction === 'right' ? 1 : -1;
          ctx.beginPath();
          ctx.moveTo(sx, lineY);
          ctx.lineTo(sx + dir * lineLen, lineY);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.beginPath();
          ctx.moveTo(sx + dir * lineLen, lineY);
          ctx.lineTo(sx + dir * (lineLen - 6), lineY - 4);
          ctx.lineTo(sx + dir * (lineLen - 6), lineY + 4);
          ctx.closePath();
          ctx.fillStyle = direction === 'right' ? '#5fc587' : '#e2b15f';
          ctx.fill();
        }
        ctx.restore();
      } else if(o.kind === 'bird'){
        // Bird preview: draw the idle frame for the species. Birds are
        // small (16x16 source → 32px display).
        const species = o.species || o.variant || 'cardinal';
        const stripKey = 'bird_' + species + '_idle';
        const img = assets[stripKey];
        const w = 32 * SCALE;
        const h = 32 * SCALE;
        const FRAME_SRC = 16;
        const dx = sx - w/2;
        const dy = sy - h/2;
        if(img && img.complete){
          ctx.drawImage(img, 0, 0, FRAME_SRC, FRAME_SRC, dx, dy, w, h);
        }
      }

      // Selection ring around just-placed items would go here if we tracked it
    }

    // ============ INPUT ============
    // Touch / pointer model: a quick tap places or deletes; a drag scrolls.
    // We don't have native gestures so we hand-roll: track touch start position
    // and time; if movement is small enough and time is short enough, it's a tap.

    let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
    let touchStartScrollY = 0;
    let touchMoved = false;
    let lastY = 0, velocity = 0;
    let momentumId = null;

    function onPointerDown(e){
      // Pinch / multi-touch: don't initiate drag
      if(e.pointerType === 'touch' && e.isPrimary === false) {
        pinchActive = true;
        return;
      }
      pinchActive = false;
      cancelMomentum();
      const rect = canvas.getBoundingClientRect();
      touchStartX = e.clientX - rect.left;
      touchStartY = e.clientY - rect.top;
      touchStartTime = Date.now();
      touchStartScrollY = scrollY;
      touchMoved = false;
      lastY = touchStartY;
      velocity = 0;
      canvas.setPointerCapture(e.pointerId);
    }

    function onPointerMove(e){
      if(pinchActive) return;
      if(!canvas.hasPointerCapture(e.pointerId)) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const dy = y - touchStartY;
      // If we've moved more than 8px, treat it as a scroll drag
      if(Math.abs(dy) > 8) touchMoved = true;
      if(touchMoved){
        scrollY = touchStartScrollY - dy / viewScale;
        clampScroll();
        // Track velocity for momentum
        velocity = (y - lastY);
        lastY = y;
        draw();
      }
    }

    function onPointerUp(e){
      if(pinchActive){ pinchActive = false; return; }
      if(!canvas.hasPointerCapture(e.pointerId)) return;
      canvas.releasePointerCapture(e.pointerId);
      const elapsed = Date.now() - touchStartTime;
      if(!touchMoved && elapsed < 500){
        // It's a tap — place or delete
        const rect = canvas.getBoundingClientRect();
        const tapX = e.clientX - rect.left;
        const tapY = e.clientY - rect.top;
        handleTap(tapX, tapY);
      } else if(touchMoved && Math.abs(velocity) > 2){
        // Start momentum scroll
        startMomentum();
      }
    }

    function startMomentum(){
      function tick(){
        velocity *= 0.93;
        if(Math.abs(velocity) < 0.5){ momentumId = null; return; }
        scrollY -= velocity / viewScale;
        clampScroll();
        draw();
        momentumId = requestAnimationFrame(tick);
      }
      momentumId = requestAnimationFrame(tick);
    }
    function cancelMomentum(){
      if(momentumId){ cancelAnimationFrame(momentumId); momentumId = null; }
    }

    function clampScroll(){
      const maxScroll = level.length + 200 - canvasH / viewScale * 0.5;
      if(scrollY < -100) scrollY = -100;
      if(scrollY > maxScroll) scrollY = maxScroll;
    }

    canvas.addEventListener('pointerdown', onPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', e => {
      if(canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
      pinchActive = false;
    });

    // Wheel scroll (desktop)
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      cancelMomentum();
      scrollY += e.deltaY / viewScale * 1.5;
      clampScroll();
      draw();
    }, { passive: false });

    function handleTap(tapX, tapY){
      const worldY = screenToWorldY(tapY);
      const worldX = screenToWorldX(tapX);
      const xFrac = worldX / GAME_W;

      if(deleteMode){
        // Find nearest obstacle within a generous tap radius
        const tapRadius = 40 / viewScale; // ~40 screen px in world units
        let nearest = null, nearestDist = Infinity;
        for(const o of level.obstacles){
          const dx = (o.xFrac * GAME_W) - worldX;
          const dy = o.y - worldY;
          const dist = Math.hypot(dx, dy);
          if(dist < tapRadius && dist < nearestDist){
            nearest = o;
            nearestDist = dist;
          }
        }
        if(nearest){
          level.obstacles = level.obstacles.filter(o => o !== nearest);
          draw();
        }
        return;
      }

      // Place an obstacle
      if(worldY < 0 || worldY > level.length) return;
      // Cliffs and avalanche triggers span the full width — clamp x to center.
      let placedXFrac = xFrac;
      if(selectedKind === 'cliff' || selectedKind === 'avalanche_trigger'){
        placedXFrac = 0.5;
      }
      const obstacle = {
        kind: selectedKind,
        y: Math.round(worldY),
        xFrac: Math.max(0.05, Math.min(0.95, placedXFrac)),
      };
      // Attach explicit variant if one is chosen for this kind (otherwise
      // the game will fall back to its hash-based selection)
      if(selectedVariants[selectedKind]){
        obstacle.variant = selectedVariants[selectedKind];
      }
      // Animal-specific: store species + direction. Direction is derived
      // from the tap location — tap on the LEFT half of the path → animal
      // idles on the left and runs RIGHT (and vice versa). Intuitive: you
      // tap where the animal should START.
      if(selectedKind === 'animal'){
        obstacle.species = selectedVariants.animal || 'deer_buck';
        obstacle.direction = (xFrac < 0.5) ? 'right' : 'left';
      }
      level.obstacles.push(obstacle);
      draw();
    }

    // ============ PALETTE & VARIANTS ============
    // Variants: kinds that have multiple sprite choices. The editor lets you
    // pick which specific sprite a placed obstacle should use, instead of
    // leaving it up to the game's deterministic hashing.
    const VARIANTS = {
      tree:    ['tree0', 'tree1', 'tree2', 'tree3'],
      snowman: ['snowman0', 'snowman1', 'snowman2', 'snowman3', 'snowman4', 'snowman5'],
      ice:     ['ice_a', 'ice_b', 'ice_c'],
      animal:  ['deer_buck', 'deer_doe', 'rabbit_brown', 'rabbit_white', 'bear'],
      rock:    ['rock_s1', 'rock_s2', 'rock_s3', 'rock_m1', 'rock_m2', 'rock_m3', 'rock_l1', 'rock_l2', 'rock_l3'],
    };
    // Remember the most-recently-picked variant per kind so switching kinds
    // and back doesn't reset your selection.
    const selectedVariants = { tree: null, snowman: null, ice: null, animal: 'deer_buck', rock: null };

    const paletteBtns = document.querySelectorAll('#palette button');
    const variantStrip = document.getElementById('variantStrip');

    function setSelectedKind(kind){
      selectedKind = kind;
      deleteMode = false;
      paletteBtns.forEach(b => b.classList.toggle('active', b.dataset.kind === kind));
      document.getElementById('btnDelete').classList.remove('active');
      renderVariantStrip();
    }

    function renderVariantStrip(){
      variantStrip.innerHTML = '';
      const variants = VARIANTS[selectedKind];
      if(!variants){
        variantStrip.classList.remove('show');
        return;
      }
      variantStrip.classList.add('show');

      // "Random" chip — fall back to hash-based selection. Animals always
      // need an explicit species (no hash fallback), so skip the random
      // chip for them.
      if(selectedKind !== 'animal'){
        const randomChip = document.createElement('div');
        randomChip.className = 'variant-chip' + (selectedVariants[selectedKind] === null ? ' active' : '');
        const randomLabel = document.createElement('div');
        randomLabel.style.cssText = 'color:#E8F0FC;font-size:11px;font-weight:600;text-align:center;line-height:1.2;';
        randomLabel.innerHTML = 'Any<br>(random)';
        randomChip.appendChild(randomLabel);
        randomChip.addEventListener('click', () => {
          selectedVariants[selectedKind] = null;
          renderVariantStrip();
        });
        variantStrip.appendChild(randomChip);
      }

      // One chip per variant, with a small canvas preview of the sprite.
      // For animal species the asset is a 4-frame strip (or 12-frame for
      // rabbit idle); draw only the FIRST frame so the chip reads cleanly.
      for(const v of variants){
        const chip = document.createElement('div');
        chip.className = 'variant-chip' + (selectedVariants[selectedKind] === v ? ' active' : '');
        const c = document.createElement('canvas');
        c.width = 48; c.height = 48;
        const cctx = c.getContext('2d');
        // Animals: the variant value is a species ID. The actual asset key
        // we want to preview from is `<species>_idle` (a strip). Slice the
        // first 32x32 frame.
        const isAnimalKind = selectedKind === 'animal';
        const previewKey = isAnimalKind ? (v + '_idle') : v;
        const img = assets[previewKey];
        const drawPreview = () => {
          cctx.clearRect(0, 0, 48, 48);
          if(!img || !img.complete) return;
          if(isAnimalKind){
            // Crop first 32x32 frame, scale up to fit chip
            const SRC = 32;
            const scale = 48 / SRC * 0.9;
            const drawW = SRC * scale, drawH = SRC * scale;
            cctx.imageSmoothingEnabled = false;
            cctx.drawImage(img, 0, 0, SRC, SRC,
                           (48 - drawW)/2, (48 - drawH)/2, drawW, drawH);
          } else {
            const r = Math.min(48 / img.width, 48 / img.height);
            const w = img.width * r, h = img.height * r;
            cctx.drawImage(img, (48 - w)/2, (48 - h)/2, w, h);
          }
        };
        if(img && img.complete) drawPreview();
        else if(img) img.addEventListener('load', drawPreview);
        chip.appendChild(c);
        chip.addEventListener('click', () => {
          selectedVariants[selectedKind] = v;
          renderVariantStrip();
        });
        variantStrip.appendChild(chip);
      }
    }

    paletteBtns.forEach(btn => {
      btn.addEventListener('click', () => setSelectedKind(btn.dataset.kind));
    });
    setSelectedKind('tree');

    document.getElementById('btnDelete').addEventListener('click', () => {
      deleteMode = !deleteMode;
      document.getElementById('btnDelete').classList.toggle('active', deleteMode);
      if(deleteMode){
        paletteBtns.forEach(b => b.classList.remove('active'));
        variantStrip.classList.remove('show');
      } else {
        setSelectedKind(selectedKind);
      }
    });

    // Overview toggle: bird's-eye view of the entire level. Triggers a
    // resize-style recompute so viewScale + viewportX are re-derived from
    // the new mode, then redraws.
    document.getElementById('btnOverview').addEventListener('click', () => {
      overviewMode = !overviewMode;
      document.getElementById('btnOverview').classList.toggle('active', overviewMode);
      resizeCanvas();
    });

    // ============ AUTO-TREES ============
    // Generates a batch of randomly-placed trees that fill gaps in the level
    // without overlapping any existing obstacles. Used to quickly populate
    // forest sections without hand-placing every trunk. The last batch is
    // tracked so it can be undone in one click.
    let lastAutoBatch = []; // array of obstacle refs from the most recent place

    // Return {w, h, anchor} for an obstacle kind. Anchor 'base' means the
    // sprite's y is the bottom (feet on snow). 'center' means y is the
    // middle of the sprite. 'lip' is the cliff top edge. Dimensions are in
    // world units, matching how the game ultimately renders these.
    function obstacleFootprint(o){
      const k = o.kind;
      if(k === 'tree')              return { w: 33*4, h: 57*4, anchor: 'base' };
      if(k === 'log')               return { w: 32*2, h: 32*2, anchor: 'base' };
      if(k === 'snowman')           return { w: 32*2, h: 64*2, anchor: 'base' };
      if(k === 'ice')               return { w: 32*3, h: 32*3, anchor: 'center' };
      if(k === 'jump')              return { w: 32*3, h: 32*3, anchor: 'center' };
      if(k === 'powder')            return { w: o.w || 32*4, h: o.h || 32*3, anchor: 'center' };
      if(k === 'cliff')             return { w: GAME_W, h: 96*4, anchor: 'lip' };
      if(k === 'avalanche_trigger') return { w: GAME_W, h: 4,    anchor: 'center' };
      if(k === 'rock'){
        const spec = ROCK_SPECS[o.variant] || ROCK_SPECS['rock_m1'];
        return { w: spec.w, h: spec.h, anchor: 'base' };
      }
      return { w: 32, h: 32, anchor: 'center' };
    }

    // Axis-aligned bounding box (world units) for an obstacle, accounting
    // for its anchor. Returns {x0, x1, y0, y1}.
    function obstacleAABB(o){
      const f = obstacleFootprint(o);
      const cx = o.xFrac * GAME_W;
      let y0, y1;
      if(f.anchor === 'base'){
        y0 = o.y - f.h; y1 = o.y;
      } else if(f.anchor === 'lip'){
        // Cliff: lip at o.y, face extends downward
        y0 = o.y; y1 = o.y + f.h;
      } else {
        y0 = o.y - f.h/2; y1 = o.y + f.h/2;
      }
      // Cliffs and avalanche triggers span full width — clamp via center
      let x0, x1;
      if(o.kind === 'cliff' || o.kind === 'avalanche_trigger'){
        x0 = 0; x1 = GAME_W;
      } else {
        x0 = cx - f.w/2; x1 = cx + f.w/2;
      }
      return { x0, x1, y0, y1 };
    }

    // Rough collision test between two AABBs with optional padding.
    function aabbOverlap(a, b, pad){
      pad = pad || 0;
      return !(a.x1 + pad < b.x0 || a.x0 - pad > b.x1
            || a.y1 + pad < b.y0 || a.y0 - pad > b.y1);
    }

    // The trunk of a tree is narrow, so for tree-vs-tree spacing we use a
    // tighter footprint (just the trunk band) rather than the full canopy
    // rectangle — otherwise trees end up absurdly far apart.
    function treeTrunkAABB(xFrac, y){
      const cx = xFrac * GAME_W;
      return { x0: cx - 14, x1: cx + 14, y0: y - 12, y1: y + 4 };
    }

    // Generate `count` tree positions inside [yMin, yMax] that don't collide
    // with any existing obstacle. Uses rejection sampling with a per-tree
    // attempt cap so densely-packed levels don't hang the browser.
    function generateAutoTrees(opts){
      const { count, yMin, yMax, edgeBias, variant, minSpacing } = opts;
      const placed = [];
      const existing = level.obstacles.slice();
      const ATTEMPTS_PER_TREE = 25;

      for(let i = 0; i < count; i++){
        let placedThis = false;
        for(let a = 0; a < ATTEMPTS_PER_TREE; a++){
          const y = yMin + Math.random() * (yMax - yMin);
          // Edge bias: at bias=0 uniform, at bias=1 strongly pushed to sides.
          // We pick a centered random in [-1, 1], skew it outward, then
          // remap into [0.04, 0.96].
          let r = Math.random() * 2 - 1; // -1..1
          if(edgeBias > 0){
            const sign = r < 0 ? -1 : 1;
            const mag = Math.abs(r);
            // Raise magnitude to a power < 1 → pushes values toward |1|
            const pushed = Math.pow(mag, 1 - edgeBias * 0.7);
            r = sign * pushed;
          }
          const xFrac = 0.5 + r * 0.46; // → 0.04 .. 0.96

          // Candidate tree AABB (use trunk footprint for self-vs-self)
          const candTrunk = treeTrunkAABB(xFrac, y);
          // For checking against non-tree obstacles, use full canopy
          const candCanopy = {
            x0: xFrac * GAME_W - 33*2,
            x1: xFrac * GAME_W + 33*2,
            y0: y - 57*4,
            y1: y,
          };

          // Reject if too close to anything already on the level
          let collides = false;
          for(const o of existing){
            const oBox = obstacleAABB(o);
            // Trees use trunk-vs-trunk spacing for tightness; everything
            // else uses canopy to keep clear of wide hazards.
            if(o.kind === 'tree'){
              const otrunk = treeTrunkAABB(o.xFrac, o.y);
              if(aabbOverlap(candTrunk, otrunk, minSpacing)){ collides = true; break; }
            } else {
              if(aabbOverlap(candCanopy, oBox, minSpacing * 0.4)){ collides = true; break; }
            }
          }
          // Also check against trees we've already placed in this batch
          if(!collides){
            for(const p of placed){
              const ptrunk = treeTrunkAABB(p.xFrac, p.y);
              if(aabbOverlap(candTrunk, ptrunk, minSpacing)){ collides = true; break; }
            }
          }
          if(collides) continue;

          // Accepted — build obstacle
          const tree = {
            kind: 'tree',
            y: Math.round(y),
            xFrac: Math.max(0.04, Math.min(0.96, xFrac)),
          };
          if(variant) tree.variant = variant;
          placed.push(tree);
          placedThis = true;
          break;
        }
        if(!placedThis){
          // Couldn't find a spot after many tries — level is too full to
          // continue. Bail out rather than spin forever.
          break;
        }
      }
      return placed;
    }

    document.getElementById('btnAutoTrees').addEventListener('click', () => {
      showAutoTreesModal();
    });

    function showAutoTreesModal(){
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      const viewYMin = Math.max(0, Math.round(scrollY));
      const viewYMax = Math.min(level.length, Math.round(scrollY + canvasH / viewScale));
      const hasLast = lastAutoBatch.length > 0;
      bg.innerHTML = `
        <div class="modal" style="max-width:340px">
          <h2>Auto-place trees</h2>
          <div style="font-size:11px; opacity:0.7; margin-bottom:10px">
            Fills empty space with trees. Won't overlap anything already placed.
          </div>

          <label>Density</label>
          <select id="atDensity" style="width:100%; margin-bottom:10px; padding:6px; background:#1a1f2e; color:#eaecf5; border:1px solid #2c3344; border-radius:4px">
            <option value="sparse">Sparse</option>
            <option value="medium" selected>Medium</option>
            <option value="dense">Dense</option>
          </select>

          <label>Region</label>
          <select id="atRegion" style="width:100%; margin-bottom:10px; padding:6px; background:#1a1f2e; color:#eaecf5; border:1px solid #2c3344; border-radius:4px">
            <option value="all" selected>Whole level (y 0–${level.length})</option>
            <option value="view">Current view (y ${viewYMin}–${viewYMax})</option>
            <option value="custom">Custom range…</option>
          </select>
          <div id="atCustomRow" style="display:none; gap:8px; margin-bottom:10px">
            <div style="flex:1">
              <label>From y</label>
              <input id="atYMin" type="number" value="${viewYMin}" style="width:100%">
            </div>
            <div style="flex:1">
              <label>To y</label>
              <input id="atYMax" type="number" value="${viewYMax}" style="width:100%">
            </div>
          </div>

          <label>Edge bias <span id="atBiasVal" style="opacity:0.6">0.5</span></label>
          <input id="atBias" type="range" min="0" max="1" step="0.05" value="0.5" style="width:100%; margin-bottom:10px">

          <label>Variant</label>
          <select id="atVariant" style="width:100%; margin-bottom:14px; padding:6px; background:#1a1f2e; color:#eaecf5; border:1px solid #2c3344; border-radius:4px">
            <option value="">Random mix</option>
            <option value="tree0">tree0</option>
            <option value="tree1">tree1</option>
            <option value="tree2">tree2</option>
            <option value="tree3">tree3</option>
          </select>

          <div class="row">
            <button id="atCancel">Cancel</button>
            ${hasLast ? '<button id="atUndo">Undo last</button>' : ''}
            <button id="atPlace" class="primary">Place</button>
          </div>
        </div>
      `;
      // Show/hide custom range row
      const regionSel = bg.querySelector('#atRegion');
      const customRow = bg.querySelector('#atCustomRow');
      regionSel.addEventListener('change', () => {
        customRow.style.display = regionSel.value === 'custom' ? 'flex' : 'none';
      });
      // Bias slider readout
      const biasSlider = bg.querySelector('#atBias');
      const biasVal = bg.querySelector('#atBiasVal');
      biasSlider.addEventListener('input', () => { biasVal.textContent = biasSlider.value; });

      bg.querySelector('#atCancel').addEventListener('click', () => bg.remove());
      if(hasLast){
        bg.querySelector('#atUndo').addEventListener('click', () => {
          const toRemove = new Set(lastAutoBatch);
          level.obstacles = level.obstacles.filter(o => !toRemove.has(o));
          lastAutoBatch = [];
          draw();
          bg.remove();
        });
      }
      bg.querySelector('#atPlace').addEventListener('click', () => {
        const density = bg.querySelector('#atDensity').value;
        const region = regionSel.value;
        const edgeBias = parseFloat(biasSlider.value);
        const variant = bg.querySelector('#atVariant').value || null;

        let yMin, yMax;
        if(region === 'view'){ yMin = viewYMin; yMax = viewYMax; }
        else if(region === 'all'){ yMin = 0; yMax = level.length; }
        else {
          yMin = Math.max(0, parseInt(bg.querySelector('#atYMin').value, 10) || 0);
          yMax = Math.min(level.length, parseInt(bg.querySelector('#atYMax').value, 10) || level.length);
        }
        if(yMax <= yMin){ alert('Invalid range'); return; }

        // Density → target count + spacing (in world units). A tree's full
        // sprite is 132x228 world units; sparse leaves big gaps, dense
        // packs tighter but still legible from the player's perspective.
        const span = yMax - yMin;
        let perThousand, minSpacing;
        if(density === 'sparse'){ perThousand = 6;  minSpacing = 40; }
        else if(density === 'dense'){ perThousand = 22; minSpacing = 10; }
        else                       { perThousand = 12; minSpacing = 22; }
        const count = Math.max(1, Math.round(span / 1000 * perThousand));

        const newTrees = generateAutoTrees({
          count, yMin, yMax, edgeBias, variant, minSpacing,
        });

        if(newTrees.length === 0){
          alert('No room to place trees in that range — try a different region or lower density.');
          return;
        }

        for(const t of newTrees) level.obstacles.push(t);
        lastAutoBatch = newTrees;
        draw();
        bg.remove();

        // Brief inline toast in the status pill so you know what happened
        const requested = count;
        if(newTrees.length < requested){
          setTimeout(() => {
            alert(`Placed ${newTrees.length} of ${requested} trees — level was too full to fit the rest.`);
          }, 50);
        }
      });
      document.body.appendChild(bg);
    }

    // ============ BOULDER FIELD ============
    // Same flow as auto-trees but scatters rocks of varied sizes. The mix
    // slider controls the small/medium/large ratio: 0 = mostly small, 1 =
    // mostly large. Reuses the lastAutoBatch tracker so undo works for
    // either kind of placement.
    const ROCK_BUCKETS = {
      small:  ['rock_s1', 'rock_s2', 'rock_s3'],
      medium: ['rock_m1', 'rock_m2', 'rock_m3'],
      large:  ['rock_l1', 'rock_l2', 'rock_l3'],
    };

    // Pick a rock variant given a size-mix [0..1]. Builds a weighted
    // distribution: at mix=0 only small, at mix=0.5 even mix, at mix=1
    // only large. The weights for the three tiers are derived from a
    // triangular shape that peaks where the mix slider points.
    function pickRockVariant(mix){
      // Tier centers at 0, 0.5, 1. Weight = max(0, 1 - 2 * |center - mix|)
      // → tier exactly under the slider gets weight 1, neighbors taper.
      const centers = [
        { tier: 'small',  c: 0   },
        { tier: 'medium', c: 0.5 },
        { tier: 'large',  c: 1   },
      ];
      let total = 0;
      const weights = centers.map(({tier, c}) => {
        const w = Math.max(0, 1 - 2 * Math.abs(c - mix));
        total += w;
        return { tier, w };
      });
      // Floor weight so no tier is fully starved when mix is at an extreme
      // — otherwise mix=0 would yield literally zero medium/large rocks,
      // which is fine, but a tiny chance of variety reads as more natural.
      const FLOOR = 0.05;
      for(const wt of weights){ wt.w = Math.max(wt.w, FLOOR); total += FLOOR; }

      let pick = Math.random() * total;
      let chosen = 'small';
      for(const wt of weights){
        if(pick < wt.w){ chosen = wt.tier; break; }
        pick -= wt.w;
      }
      const bucket = ROCK_BUCKETS[chosen];
      return bucket[Math.floor(Math.random() * bucket.length)];
    }

    // Generate `count` rocks inside [yMin, yMax]. Uses rejection sampling
    // against all existing obstacles. Rocks can be packed closer together
    // than trees because their footprints are smaller and the visual
    // expectation is "a field of rocks" — they're meant to look clustered.
    function generateBoulderField(opts){
      const { count, yMin, yMax, edgeBias, mix, minSpacing } = opts;
      const placed = [];
      const existing = level.obstacles.slice();
      const ATTEMPTS_PER_ROCK = 30;

      for(let i = 0; i < count; i++){
        let placedThis = false;
        for(let a = 0; a < ATTEMPTS_PER_ROCK; a++){
          const y = yMin + Math.random() * (yMax - yMin);
          // Edge bias: 0 = uniform, 1 = pushed toward edges. Same shaping
          // as auto-trees.
          let r = Math.random() * 2 - 1;
          if(edgeBias > 0){
            const sign = r < 0 ? -1 : 1;
            const mag = Math.abs(r);
            const pushed = Math.pow(mag, 1 - edgeBias * 0.7);
            r = sign * pushed;
          }
          const xFrac = 0.5 + r * 0.46;

          // Pick a candidate variant from the size mix.
          const variant = pickRockVariant(mix);
          const spec = ROCK_SPECS[variant];

          // Candidate AABB — base-anchored, so y is the bottom of the rock.
          const candBox = {
            x0: xFrac * GAME_W - spec.w/2,
            x1: xFrac * GAME_W + spec.w/2,
            y0: y - spec.h,
            y1: y,
          };

          // Reject if too close to anything already on the level.
          let collides = false;
          for(const o of existing){
            const oBox = obstacleAABB(o);
            // Rocks-against-trees: tighten using trunk AABB so rocks can
            // nestle near tree trunks but not under canopies.
            if(o.kind === 'tree'){
              const otrunk = treeTrunkAABB(o.xFrac, o.y);
              if(aabbOverlap(candBox, otrunk, minSpacing)){ collides = true; break; }
            } else {
              if(aabbOverlap(candBox, oBox, minSpacing * 0.4)){ collides = true; break; }
            }
          }
          // Also check against rocks already placed in this batch.
          if(!collides){
            for(const p of placed){
              const pSpec = ROCK_SPECS[p.variant];
              const pBox = {
                x0: p.xFrac * GAME_W - pSpec.w/2,
                x1: p.xFrac * GAME_W + pSpec.w/2,
                y0: p.y - pSpec.h,
                y1: p.y,
              };
              // Rocks-vs-rocks: small spacing — they're allowed to cluster.
              if(aabbOverlap(candBox, pBox, minSpacing * 0.2)){ collides = true; break; }
            }
          }
          if(collides) continue;

          placed.push({
            kind: 'rock',
            variant,
            y: Math.round(y),
            xFrac: Math.max(0.04, Math.min(0.96, xFrac)),
          });
          placedThis = true;
          break;
        }
        if(!placedThis) break; // level too full to continue
      }
      return placed;
    }

    document.getElementById('btnBoulderField').addEventListener('click', () => {
      showBoulderFieldModal();
    });

      bg.className = 'modal-bg';

      const viewYMax = Math.min(level.length, Math.round(scrollY + canvasH / viewScale));
      const hasLast = lastAutoBatch.length > 0;
      bg.innerHTML = `
        <div class="modal" style="max-width:340px">

          <select id="bfDensity" style="width:100%; margin-bottom:10px; padding:6px; background:#1a1f2e; color:#eaecf5; border:1px solid #2c3344; border-radius:4px">
            <option value="sparse">Sparse — scattered stones</option>
            <option value="medium" selected>Medium — proper field</option>
            <option value="dense">Dense — boulder garden</option>
          </select>

          <label>Region</label>
          <select id="bfRegion" style="width:100%; margin-bottom:10px; padding:6px; background:#1a1f2e; color:#eaecf5; border:1px solid #2c3344; border-radius:4px">
            <option value="view" selected>Current view (y ${viewYMin}–${viewYMax})</option>
            <option value="all">Whole level (y 0–${level.length})</option>

          </select>
          <div id="bfCustomRow" style="display:none; gap:8px; margin-bottom:10px">

          </div>

          <label>Size mix <span id="bfMixVal" style="opacity:0.6">0.50 (balanced)</span></label>
          <input id="bfMix" type="range" min="0" max="1" step="0.05" value="0.5" style="width:100%; margin-bottom:10px">
          <div style="font-size:10px; opacity:0.5; margin: -6px 0 10px; display:flex; justify-content:space-between">
            <span>← mostly small</span><span>mostly large →</span>
          </div>

          <label>Edge bias <span id="bfBiasVal" style="opacity:0.6">0.30</span></label>
          <input id="bfBias" type="range" min="0" max="1" step="0.05" value="0.3" style="width:100%; margin-bottom:14px">

          <div class="row">
            <button id="bfCancel">Cancel</button>
            ${hasLast ? '<button id="bfUndo">Undo last</button>' : ''}
            <button id="bfPlace" class="primary">Place</button>
          </div>
        </div>
      `;

      // Show/hide custom range row
      const regionSel = bg.querySelector('#bfRegion');
      const customRow = bg.querySelector('#bfCustomRow');
      regionSel.addEventListener('change', () => {
        customRow.style.display = regionSel.value === 'custom' ? 'flex' : 'none';
      });

      // Slider readouts
      const mixSlider = bg.querySelector('#bfMix');
      const mixVal = bg.querySelector('#bfMixVal');
      const mixLabel = (m) => {
        const v = parseFloat(m);
        if(v < 0.25)      return v.toFixed(2) + ' (mostly small)';
        else if(v < 0.45) return v.toFixed(2) + ' (small/med)';
        else if(v < 0.55) return v.toFixed(2) + ' (balanced)';
        else if(v < 0.75) return v.toFixed(2) + ' (med/large)';
        else              return v.toFixed(2) + ' (mostly large)';
      };
      mixSlider.addEventListener('input', () => { mixVal.textContent = mixLabel(mixSlider.value); });
      const biasSlider = bg.querySelector('#bfBias');
      const biasVal = bg.querySelector('#bfBiasVal');
      biasSlider.addEventListener('input', () => { biasVal.textContent = parseFloat(biasSlider.value).toFixed(2); });

      bg.querySelector('#bfCancel').addEventListener('click', () => bg.remove());
      if(hasLast){
        bg.querySelector('#bfUndo').addEventListener('click', () => {
          const toRemove = new Set(lastAutoBatch);
          level.obstacles = level.obstacles.filter(o => !toRemove.has(o));
          lastAutoBatch = [];
          draw();
          bg.remove();
        });
      }

      bg.querySelector('#bfPlace').addEventListener('click', () => {
        const density = bg.querySelector('#bfDensity').value;
        const region = regionSel.value;
        const mix = parseFloat(mixSlider.value);
        const edgeBias = parseFloat(biasSlider.value);

        let yMin, yMax;
        if(region === 'view'){ yMin = viewYMin; yMax = viewYMax; }
        else if(region === 'all'){ yMin = 0; yMax = level.length; }
        else {
          yMin = Math.max(0, parseInt(bg.querySelector('#bfYMin').value, 10) || 0);
          yMax = Math.min(level.length, parseInt(bg.querySelector('#bfYMax').value, 10) || level.length);
        }
        if(yMax <= yMin){ alert('Invalid range'); return; }

        // Density → count + spacing (world units). Rocks pack tighter than
        // trees — a real boulder field has stones almost touching.
        const span = yMax - yMin;
        let perThousand, minSpacing;
        if(density === 'sparse'){ perThousand = 8;  minSpacing = 24; }
        else if(density === 'dense'){ perThousand = 28; minSpacing = 4; }
        else                       { perThousand = 16; minSpacing = 12; }
        const count = Math.max(1, Math.round(span / 1000 * perThousand));

        const newRocks = generateBoulderField({
          count, yMin, yMax, edgeBias, mix, minSpacing,
        });

        if(newRocks.length === 0){
          alert('No room to place rocks in that range — try a different region or lower density.');
          return;
        }

        for(const r of newRocks) level.obstacles.push(r);
        lastAutoBatch = newRocks;
        draw();
        bg.remove();

        if(newRocks.length < count){
          setTimeout(() => {
            alert(`Placed ${newRocks.length} of ${count} rocks — level was too full to fit the rest.`);
          }, 50);
        }
      });
      document.body.appendChild(bg);
    }

    // ============ ENABLE BIRDS ============
    // Auto-places 1-2 small flocks of birds across the level. Each flock
    // shares a primary species (~85% of birds in the flock), with a small
    // chance of intermingling — 15% of birds use a different species. The
    // flock ID is unique across flocks so they can be triggered
    // independently.
    const BIRD_SPECIES = [
      'cardinal', 'bluejay', 'chickadee', 'crow', 'finch',
      'magpie', 'robin', 'stellerjay', 'dove', 'thrush',
      'waxwing', 'hummingbird',
    ];

    document.getElementById('btnEnableBirds').addEventListener('click', () => {
      // Decide the number of flocks: 1 or 2 (matches user spec).
      const flockCount = 1 + (Math.random() < 0.5 ? 0 : 1);

      // Pick a primary species. 85% of birds in each flock use it; the
      // remaining 15% are randomly different — a small intermingling for
      // visual interest without breaking the "same species" feel.
      const primary = BIRD_SPECIES[Math.floor(Math.random() * BIRD_SPECIES.length)];

      const newBirds = [];
      // Pick a starting flock ID that doesn't collide with existing birds.
      const existingFlockIds = new Set(
        level.obstacles.filter(o => o.kind === 'bird').map(o => o.flockId)
      );
      let nextFlockId = 0;
      while(existingFlockIds.has(nextFlockId)) nextFlockId++;

      for(let f = 0; f < flockCount; f++){
        const flockId = nextFlockId + f;
        const flockSize = 3 + Math.floor(Math.random() * 4); // 3-6 birds

        // Pick a flock center somewhere in the middle 80% of the level
        // (avoid the very start where the instructor cutscene plays, and
        // the very end near the finish).
        const minY = Math.max(400, level.length * 0.15);
        const maxY = level.length * 0.95 - 100;
        let centerY, centerXFrac;
        let attempts = 0;
        let placedFlockCenter = false;
        while(attempts < 20 && !placedFlockCenter){
          attempts++;
          centerY = Math.round(minY + Math.random() * (maxY - minY));
          // Bias toward slope edges — birds typically perch off to the
          // sides, not in the middle of the run.
          const edgePick = Math.random();
          centerXFrac = edgePick < 0.5
            ? 0.08 + Math.random() * 0.22  // left edge
            : 0.70 + Math.random() * 0.22; // right edge

          // Don't place a flock near another flock or a critical obstacle.
          let tooClose = false;
          for(const o of level.obstacles){
            if(o.kind !== 'bird' && o.kind !== 'cliff' && o.kind !== 'avalanche_trigger') continue;
            const dy = Math.abs(o.y - centerY);
            if(dy < 220){ tooClose = true; break; }
          }
          if(!tooClose){ placedFlockCenter = true; }
        }
        if(!placedFlockCenter) continue;

        // Place birds within a small radius around the center
        const FLOCK_RADIUS_Y = 30;
        const FLOCK_RADIUS_X = 0.10; // in xFrac units
        for(let i = 0; i < flockSize; i++){
          // 85% primary species, 15% random other
          let species = primary;
          if(Math.random() < 0.15){
            species = BIRD_SPECIES[Math.floor(Math.random() * BIRD_SPECIES.length)];
          }
          newBirds.push({
            kind: 'bird',
            species,
            flockId,
            y: Math.round(centerY + (Math.random() - 0.5) * 2 * FLOCK_RADIUS_Y),
            xFrac: Math.max(0.04, Math.min(0.96,
              centerXFrac + (Math.random() - 0.5) * 2 * FLOCK_RADIUS_X)),
          });
        }
      }

      if(newBirds.length === 0){
        alert('No room to place bird flocks — try a different region or reduce existing obstacles.');
        return;
      }
      for(const b of newBirds) level.obstacles.push(b);
      lastAutoBatch = newBirds;
      draw();
      flashMessage(`Placed ${newBirds.length} birds in ${flockCount} flock${flockCount > 1 ? 's' : ''}`);
    });

    // ============ LENGTH ============
    document.getElementById('btnLength').addEventListener('click', () => {
      const input = prompt('Level length (e.g. 4000, 5500, 7500):', String(level.length));
      if(!input) return;
      const n = parseInt(input, 10);
      if(isNaN(n) || n < 1000 || n > 20000){
        alert('Length must be between 1000 and 20000');
        return;
      }
      level.length = n;
      if(overviewMode) resizeCanvas(); else draw();
    });

    // ============ NEW ============
    document.getElementById('btnNew').addEventListener('click', () => {
      if(level.obstacles.length > 0 && !confirm('Clear current level? (Save first if you want to keep it.)')) return;
      level = { name: 'My Level', length: 4000, obstacles: [] };
      scrollY = 0;
      document.getElementById('levelName').value = level.name;
      if(overviewMode) resizeCanvas(); else draw();
    });

    // ============ NAME ============
    document.getElementById('levelName').addEventListener('input', e => {
      level.name = e.target.value || 'My Level';
    });

    // ============ SAVE / LOAD ============
    function getSaved(){
      try {
        const raw = localStorage.getItem('slope_editor_saves');
        return raw ? JSON.parse(raw) : {};
      } catch(e){ return {}; }
    }
    function writeSaved(saves){
      try { localStorage.setItem('slope_editor_saves', JSON.stringify(saves)); } catch(e){}
    }

    document.getElementById('btnSave').addEventListener('click', () => {
      const saves = getSaved();
      const id = level.name.trim() || 'Untitled';
      saves[id] = {
        name: level.name,
        length: level.length,
        obstacles: level.obstacles,
        savedAt: Date.now(),
      };
      writeSaved(saves);
      flashMessage('Saved "' + id + '"');
    });

    document.getElementById('btnLoad').addEventListener('click', () => {
      const saves = getSaved();
      const keys = Object.keys(saves);
      if(keys.length === 0){
        alert('No saved levels yet.');
        return;
      }
      showLoadModal(saves);
    });

    function showLoadModal(saves){
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `
        <div class="modal">
          <h2>Load level</h2>
          <div class="modal-list" id="loadList"></div>
          <div class="row">
            <button id="modalClose">Cancel</button>
          </div>
        </div>
      `;
      document.body.appendChild(bg);
      const list = bg.querySelector('#loadList');
      const sortedKeys = Object.keys(saves).sort((a, b) => (saves[b].savedAt || 0) - (saves[a].savedAt || 0));
      for(const key of sortedKeys){
        const s = saves[key];
        const item = document.createElement('div');
        item.className = 'modal-list-item';
        item.innerHTML = `
          <div>
            <div class="name">${escapeHtml(s.name)}</div>
            <div class="meta">${s.obstacles.length} obstacles · ${s.length}m</div>
          </div>
          <button data-action="load">Load</button>
          <button data-action="delete" class="delete">×</button>
        `;
        item.querySelector('[data-action=load]').addEventListener('click', () => {
          level = JSON.parse(JSON.stringify(s));
          scrollY = 0;
          document.getElementById('levelName').value = level.name;
          bg.remove();
          if(overviewMode) resizeCanvas(); else draw();
        });
        item.querySelector('[data-action=delete]').addEventListener('click', () => {
          if(!confirm('Delete "' + s.name + '"?')) return;
          const cur = getSaved();
          delete cur[key];
          writeSaved(cur);
          item.remove();
        });
        list.appendChild(item);
      }
      bg.querySelector('#modalClose').addEventListener('click', () => bg.remove());
      bg.addEventListener('click', e => { if(e.target === bg) bg.remove(); });
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ============ EXPORT ============
    document.getElementById('btnExport').addEventListener('click', () => {
      // Generate the JS snippet ready to paste into the game's LEVELS array
      const id = level.name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'custom';
      const finishY = level.length - 200;
      const sorted = level.obstacles.slice().sort((a, b) => a.y - b.y);
      const obstaclesStr = sorted.map(o => {
        const variantPart = o.variant ? `, variant:'${o.variant}'` : '';
        return `        { kind:'${o.kind}', y: ${o.y}, x: W*${o.xFrac.toFixed(2)}${variantPart} },`;
      }).join('\n');
      const snippet = `    {
      id: '${id}',
      name: '${level.name.replace(/'/g, "\\'")}',
      mapX: 0.50, mapY: 0.50,
      length: ${level.length},
      finishY: ${finishY},
      obstacles: [
${obstaclesStr}
      ],
    },`;
      showExportModal(snippet);
    });

    function showExportModal(snippet){
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `
        <div class="modal">
          <h2>Level data</h2>
          <div style="font-size:12px;opacity:0.8;">Copy this and paste it into the LEVELS array in skier.html, or share it with Claude to add it to the game.</div>
          <textarea readonly id="exportText"></textarea>
          <div class="row">
            <button id="modalCopy" class="primary">Copy</button>
            <button id="modalDownload">Download</button>
            <button id="modalClose">Done</button>
          </div>
        </div>
      `;
      document.body.appendChild(bg);
      const ta = bg.querySelector('#exportText');
      ta.value = snippet;
      bg.querySelector('#modalCopy').addEventListener('click', () => {
        ta.select();
        try {
          navigator.clipboard.writeText(snippet);
          flashMessage('Copied to clipboard');
        } catch(e){
          document.execCommand('copy');
          flashMessage('Copied to clipboard');
        }
      });
      bg.querySelector('#modalDownload').addEventListener('click', () => {
        const blob = new Blob([snippet], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const id = level.name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'level';
        a.download = id + '.txt';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
      bg.querySelector('#modalClose').addEventListener('click', () => bg.remove());
      bg.addEventListener('click', e => { if(e.target === bg) bg.remove(); });
    }

    // ============ FLASH MESSAGES ============
    function flashMessage(msg){
      const div = document.createElement('div');
      div.textContent = msg;
      div.style.cssText = `
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(46, 125, 79, 0.95);
        color: white;
        padding: 10px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        z-index: 200;
        pointer-events: none;
        transition: opacity 0.3s;
      `;
      document.body.appendChild(div);
      setTimeout(() => { div.style.opacity = '0'; }, 1500);
      setTimeout(() => div.remove(), 2000);
    }

    // ============ BOOT ============
    resizeCanvas();
    // Wait a tick for images to start decoding then redraw
    setTimeout(draw, 100);
    setTimeout(draw, 500);

    // Auto-save on changes (very passive — just keep the last state in
    // localStorage so refresh doesn't lose work)
    setInterval(() => {
      try {
        localStorage.setItem('slope_editor_autosave', JSON.stringify(level));
      } catch(e){}
    }, 5000);
    // Restore autosave on load
    try {
      const auto = localStorage.getItem('slope_editor_autosave');
      if(auto){
        const parsed = JSON.parse(auto);
        if(parsed && Array.isArray(parsed.obstacles)){
          level = parsed;
          document.getElementById('levelName').value = level.name || 'My Level';
          draw();
        }
      }
    } catch(e){}
  })();
  </script>
</body>
</html>
